const DIM_ICON = { openness:'💡', conscientiousness:'📋', extraversion:'🎉', agreeableness:'🤝', emotionalStability:'🧘', thinkingFeeling:'🧠', selfPresentation:'✨', worldEngagement:'🌍', fameTier:'⏳' };
const PAGE_SIZE = 4;
const CORE_ANCHOR = 8;   // 8 道核心锚题
const FOLLOWUP_COUNT = 2; // 2 道自适应追问
const TOTAL_QUESTIONS = 20;
const TOTAL_PAGES = Math.ceil(TOTAL_QUESTIONS / PAGE_SIZE);

// —— 抽题：固定锚题 + 平行轮换 + 节奏题；追问在答完 16 题后动态生成 ——
let questions = [];     // 当前题组（先 18，第 5 页前补 2 道追问）
let followups = null;   // 追问题
const answers = {};
let page = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildInitialSet() {
  const dimQuestions = {};
  DATA.questions.forEach((q) => {
    if (q.dimension !== 'fameTier') (dimQuestions[q.dimension] = dimQuestions[q.dimension] || []).push(q);
  });
  let set = [];
  DATA.dims.forEach((dn) => {
    const qs = dimQuestions[dn];
    const anchor = qs.find((q) => q.anchor) || qs[0];
    const others = qs.filter((q) => q !== anchor);
    set.push(anchor);
    set.push(shuffle(others)[0]);
  });
  const tempoQs = DATA.questions.filter((q) => q.dimension === 'fameTier');
  const tempoAnchor = tempoQs.find((q) => q.anchor) || tempoQs[0];
  const tempoOthers = tempoQs.filter((q) => q !== tempoAnchor);
  set.push(tempoAnchor);
  set.push(shuffle(tempoOthers)[0]);
  return set;
}

function buildFollowups() {
  // 前 16 道核心题的临时向量
  const coreQ = questions.filter((q) => q.dimension !== 'fameTier').slice(0, 16);
  const sums = new Array(8).fill(0), cnt = new Array(8).fill(0);
  coreQ.forEach((q) => {
    const di = DATA.dims.indexOf(q.dimension);
    sums[di] += q.options[answers[questions.indexOf(q)]].score;
    cnt[di]++;
  });
  const uv = sums.map((s, i) => s / cnt[i]);
  // top2 候选
  const ranked = DATA.people.map((p) => ({ p, d: wdist(uv, p.v) })).sort((a, b) => a.d - b.d).slice(0, 2);
  const dimDiff = DATA.dims.map((dn, i) => ({ dn, diff: Math.abs(ranked[0].p.v[i] - ranked[1].p.v[i]) })).sort((a, b) => b.diff - a.diff);
  // 未使用过的平行题（该维第 3 题）
  const unused = {};
  DATA.questions.forEach((q) => {
    if (q.dimension === 'fameTier') return;
    const used = questions.includes(q);
    if (!used && !q.anchor) {
      (unused[q.dimension] = unused[q.dimension] || []).push(q);
    }
  });
  const picked = [];
  // 追问 1：top2 差异最大维度（有未用题的话）
  for (const { dn } of dimDiff) {
    if (unused[dn] && unused[dn].length) { picked.push(unused[dn].shift()); break; }
  }
  // 追问 2：同维两题矛盾最大（有未用题的话）；否则 top2 差异次大维度
  let maxConflict = -1, conflictDim = null;
  DATA.dims.forEach((dn) => {
    const qs = coreQ.filter((q) => q.dimension === dn);
    if (qs.length >= 2) {
      const s1 = qs[0].options[answers[questions.indexOf(qs[0])]].score;
      const s2 = qs[1].options[answers[questions.indexOf(qs[1])]].score;
      if (Math.abs(s1 - s2) > maxConflict) { maxConflict = Math.abs(s1 - s2); conflictDim = dn; }
    }
  });
  let pick2 = null;
  if (conflictDim && unused[conflictDim] && unused[conflictDim].length) {
    pick2 = unused[conflictDim].shift();
  } else {
    for (const { dn } of dimDiff.slice(1)) {
      if (unused[dn] && unused[dn].length) { pick2 = unused[dn].shift(); break; }
    }
  }
  if (pick2) picked.push(pick2);
  // 不足 2 道时从任意未用平行题补
  const allUnused = Object.values(unused).flat();
  while (picked.length < 2 && allUnused.length) {
    const q = allUnused.pop();
    if (!picked.includes(q)) picked.push(q);
  }
  return picked;
}

// 初始化题组（localStorage seed 保持刷新不变）
function init() {
  let seed = localStorage.getItem('quizSeed');
  if (!seed) { seed = String(Date.now()); localStorage.setItem('quizSeed', seed); }
  // 用 seed 做简单确定性随机
  let s = parseInt(seed.slice(-6)) || 42;
  const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const oldMath = Math.random;
  Math.random = rnd;
  questions = buildInitialSet();
  Math.random = oldMath;
  // 打乱前 16 题顺序（分页均匀）
  const core = questions.slice(0, 16);
  const shuffled = shuffle(core);
  questions = shuffled.concat(questions.slice(16));
}

function pageQuestions(pg) {
  const start = pg * PAGE_SIZE;
  return questions.slice(start, start + PAGE_SIZE);
}

    card.innerHTML = `
      <div class="qnum">${icon} 第 ${qi + 1} 题 / ${TOTAL_QUESTIONS}${''}</div>
      <div class="qtext">${q.prompt}</div>
      ${q.options.map((o, oi) => '<button class="opt' + (answers[qi] === oi ? ' sel' : '') + '" data-qi="' + qi + '" data-oi="' + oi + '">' + o.text + '</button>').join('')}
    `;
    qlist.appendChild(card);
  });
  qlist.querySelectorAll('.opt').forEach((b) => {
    b.addEventListener('click', () => {
      const qi = +b.dataset.qi, oi = +b.dataset.oi;
      answers[qi] = oi;
      render();
    });
  });
  const done = Object.keys(answers).length;
  pbarFill.style.width = Math.round((done / TOTAL_QUESTIONS) * 100) + '%';
  pbarLabel.textContent = '第 ' + (page + 1) + ' / ' + TOTAL_PAGES + ' 页 · 已完成 ' + done + ' / ' + TOTAL_QUESTIONS;
  const pageDone = pageQuestions(page).every((q, li) => answers[page * PAGE_SIZE + li] !== undefined);
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = !pageDone;
  nextBtn.textContent = page === TOTAL_PAGES - 1 ? '生成结果' : '下一页';
  document.getElementById('prevBtn').className = 'navbtn prev' + (page === 0 ? ' hidden' : '');
}

function prevPage() { if (page > 0) { page--; render(); window.scrollTo({ top: 0 }); } }
function nextPage() {
  const pageDone = pageQuestions(page).every((q, li) => answers[page * PAGE_SIZE + li] !== undefined);
  if (!pageDone) return;
  if (page === TOTAL_PAGES - 2) {
    // 进入最后一页前生成追问
    if (!followups) {
      followups = buildFollowups();
      questions = questions.concat(followups);
    }
  }
  if (page < TOTAL_PAGES - 1) { page++; render(); window.scrollTo({ top: 0 }); }
  else showResult();
}

function wdist(a, b) {
  let s = 0, wsum = 0;
  for (let i = 0; i < a.length; i++) {
    const w = 1 + DATA.alpha * Math.abs(a[i] - 3);
    s += w * (a[i] - b[i]) ** 2;
    wsum += w;
  }
  return Math.sqrt(s / wsum);
}

function matchLevel(d) {
  if (d < 1.3) return { label: '高', line: '历史上几乎就是你的平行版本' };
  if (d < 2.2) return { label: '中', line: '和你同频度很高，气场接近' };
  return { label: '独特', line: '你太独特了，历史上没有完全像你的人——最接近的是' };
}

const PROTOTYPE_COLORS = ['#c0392b', '#8e44ad', '#27ae60', '#2e86c1', '#16a085', '#7d6e83', '#d4a017', '#e67e22'];

function buildMapSvg(uv, userPos, top5) {
  const W = 100, H = 80;
  const ax = DATA.axis;
  const xDir = ax.x.grad[0] >= 0 ? 1 : -1;
  const yDir = ax.y.grad[1] >= 0 ? 1 : -1;
  const SHIFT = 0.85;
  const shiftX = (0.5 - userPos[0]) * SHIFT;
  const shiftY = (0.5 - userPos[1]) * SHIFT;
  const uAbsX = userPos[0] + shiftX, uAbsY = userPos[1] + shiftY;
  const PAD = 0.04;
  const vxMin = uAbsX - (Math.max(userPos[0], 1 - userPos[0]) + PAD);
  const vxMax = uAbsX + (Math.max(userPos[0], 1 - userPos[0]) + PAD);
  const vyMin = uAbsY - (Math.max(userPos[1], 1 - userPos[1]) + PAD);
  const vyMax = uAbsY + (Math.max(userPos[1], 1 - userPos[1]) + PAD);
  const vxW = vxMax - vxMin, vyH = vyMax - vyMin;
  const map = (px, py) => [((px + shiftX - vxMin) / vxW) * W, ((py + shiftY - vyMin) / vyH) * H];
  let svg = '<svg id="map" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<line x1="' + (xDir > 0 ? 2 : W - 2) + '" y1="' + (H / 2) + '" x2="' + (xDir > 0 ? W - 2 : 2) + '" y2="' + (H / 2) + '" stroke="#d8d2c6" stroke-width="0.4" stroke-dasharray="1.5 1.5"/>';
  svg += '<line x1="' + (W / 2) + '" y1="' + (yDir > 0 ? 2 : H - 2) + '" x2="' + (W / 2) + '" y2="' + (yDir > 0 ? H - 2 : 2) + '" stroke="#d8d2c6" stroke-width="0.4" stroke-dasharray="1.5 1.5"/>';
  svg += '<text x="' + (xDir > 0 ? 2 : W - 2) + '" y="' + (H / 2 - 1.5) + '" font-size="2.4" fill="#9a938a" text-anchor="' + (xDir > 0 ? 'start' : 'end') + '">' + ax.x.labelLow + ' ←</text>';
  svg += '<text x="' + (xDir > 0 ? W - 2 : 2) + '" y="' + (H / 2 - 1.5) + '" font-size="2.4" fill="#9a938a" text-anchor="' + (xDir > 0 ? 'end' : 'start') + '">→ ' + ax.x.labelHigh + '</text>';
  svg += '<text x="' + (W / 2) + '" y="' + (yDir > 0 ? 4 : H - 3) + '" font-size="2.4" fill="#9a938a" text-anchor="middle">' + ax.y.labelHigh + ' ↑</text>';
  svg += '<text x="' + (W / 2) + '" y="' + (yDir > 0 ? H - 3 : 5) + '" font-size="2.4" fill="#9a938a" text-anchor="middle">↓ ' + ax.y.labelLow + '</text>';
  const labeled = top5.slice(0, 5);
  const labelSet = new Set(labeled.map((t) => t.p.name));
  const usedLabels = [];
  const FS = 2.7;
  const LH = FS + 1.2;
  const textW = (s) => s.length * (FS + 0.2);
  function overlaps(box) {
    for (const u of usedLabels) {
      if (box.x < u.x + u.w + 1.2 && box.x + box.w + 1.2 > u.x && box.y < u.y + LH && box.y + LH > u.y) return true;
    }
    return false;
  }
  DATA.people.forEach((p) => {
    const [mx, my] = map(p.umap[0], p.umap[1]);
    const px = mx * W, py = my * H;
    const color = PROTOTYPE_COLORS[p.prototype];
    const isTop = labelSet.has(p.name);
    svg += '<circle cx="' + px + '" cy="' + py + '" r="' + (isTop ? 2.2 : 1.0) + '" fill="' + color + '" opacity="' + (isTop ? 0.95 : 0.35) + '"/>';
    if (isTop) {
      const w = textW(p.name);
      const left = px - w / 2, right = px + w / 2;
      const cand = (x, y, anchor, boxX, boxY) => {
        let cx = x, cy = y, bx = boxX, by = boxY;
        if (anchor === 'middle') { cx = Math.max(1.5 + w / 2, Math.min(W - 1.5 - w / 2, cx)); bx = cx - w / 2; }
        else if (anchor === 'start') { cx = Math.max(1.5, Math.min(W - 1.5 - w, cx)); bx = cx; }
        else { cx = Math.max(1.5 + w, Math.min(W - 1.5, cx)); bx = cx - w; }
        cy = Math.max(2, Math.min(H - 1.5, cy)); by = cy;
        return { x: cx, y: cy, anchor, boxX: bx, boxY: by };
      };
      const candidates = [
        cand(px - w / 2, py - LH - 0.6, 'middle', left, py - LH - 0.6),
        cand(px - w / 2, py + 3.2, 'middle', left, py + 3.2),
        cand(px + 2.6, py - 1.2, 'start', right + 1.2, py - LH / 2),
        cand(px + 2.6, py + LH - 0.8, 'start', right + 1.2, py + LH - 0.8),
        cand(px - 2.6, py - 1.2, 'end', left - 1.2 - w, py - LH / 2),
        cand(px - 2.6, py + LH - 0.8, 'end', left - 1.2 - w, py + LH - 0.8),
      ];
      let chosen = null;
      for (const c of candidates) {
        const box = { x: Math.min(c.boxX, c.boxX + w), y: c.boxY, w: Math.abs(w), h: LH };
        if (!overlaps(box)) { chosen = c; break; }
      }
      if (!chosen) chosen = candidates[0];
      const box = { x: Math.min(chosen.boxX, chosen.boxX + w), y: chosen.boxY, w: Math.abs(w), h: LH };
      usedLabels.push(box);
      svg += '<text x="' + chosen.x + '" y="' + chosen.y + '" font-size="' + FS + '" fill="#2d2a26" font-weight="600" stroke="#faf9f6" stroke-width="0.9" paint-order="stroke" text-anchor="' + chosen.anchor + '">' + p.name + '</text>';
    }
  });
  const ux = map(userPos[0], userPos[1])[0] * W, uy = map(userPos[0], userPos[1])[1] * H;
  svg += '<circle cx="' + ux + '" cy="' + uy + '" r="6" fill="#d4a017" opacity="0.18"/>';
  svg += '<circle cx="' + ux + '" cy="' + uy + '" r="3.4" fill="#d4a017" stroke="#fff" stroke-width="0.8"/>';
  svg += '</svg>';
  return svg;
}

function showResult() {
  const sums = new Array(8).fill(0), cnt = new Array(8).fill(0);
  const tempoAnswers = [];
  questions.forEach((q, qi) => {
    const di = DATA.dims.indexOf(q.dimension);
    if (di >= 0) { sums[di] += q.options[answers[qi]].score; cnt[di]++; }
    else tempoAnswers.push(q.options[answers[qi]].score);
  });
  const uv = sums.map((s, i) => s / cnt[i]);
  const tempo = tempoAnswers.length ? tempoAnswers.reduce((a, b) => a + b, 0) / tempoAnswers.length : null;

  let bd = Infinity, bi = 0;
  DATA.people.forEach((p, i) => { const d = wdist(uv, p.v); if (d < bd) { bd = d; bi = i; } });
  const person = DATA.people[bi];

  let pc = 0, pbd = Infinity;
  DATA.prototypes.forEach((pt, i) => { const d = wdist(uv, pt.center); if (d < pbd) { pbd = d; pc = i; } });
  const proto = DATA.prototypes[pc];
  const same = proto.members.filter((m) => m !== person.name);

  const top5 = DATA.people.map((p, i) => ({ p, d: wdist(uv, p.v) })).sort((a, b) => a.d - b.d).slice(0, 5);
  const wSum = top5.reduce((s, t) => s + 1 / (t.d + 0.15), 0);
  const userPos = top5.reduce((acc, t) => {
    const w = 1 / (t.d + 0.15);
    acc[0] += w * t.p.umap[0]; acc[1] += w * t.p.umap[1];
    return acc;
  }, [0, 0]).map((v) => v / wSum);

  // 历史反差者
  const farK = DATA.people.map((p, i) => ({ p, d: wdist(uv, p.v) })).sort((a, b) => b.d - a.d).slice(0, 8);
  const eligible = farK.filter((t) => {
    let diff = 0;
    for (let i = 0; i < 8; i++) if (Math.abs(uv[i] - t.p.v[i]) >= 2) diff++;
    return diff >= 2 && t.p.name !== person.name;
  });
  const scored = (eligible.length ? eligible : farK.filter((t) => t.p.name !== person.name)).map((t) => ({
    p: t.p, d: t.d,
    score: 0.75 * t.d + 0.25 * ((t.p.displayExtra && t.p.displayExtra.notableWorks && t.p.displayExtra.notableWorks.length) ? 5 : 3),
  })).sort((a, b) => b.score - a.score);
  const contrast = scored[0].p;

  const DIM_TAG = { openness: '对新鲜事物', conscientiousness: '做事方式', extraversion: '社交能量', agreeableness: '待人方式', emotionalStability: '情绪', thinkingFeeling: '决策方式', selfPresentation: '自我表达', worldEngagement: '对公共事务' };
  const DIM_SIDE = { openness: ['喜欢熟悉的事物', '什么新鲜都想试试'], conscientiousness: ['随性而至', '凡事有计划'], extraversion: ['独处回血', '社交充电'], agreeableness: ['直接甚至带刺', '温和好说话'], emotionalStability: ['情绪说来就来', '心态稳如泰山'], thinkingFeeling: ['跟着感觉走', '讲道理摆逻辑'], selfPresentation: ['低调做人', '敢于表现'], worldEngagement: ['专注自己的世界', '关心公共事务'] };
  const dims8 = DATA.dims.slice(0, 8);
  const diffs = dims8.map((dn, i) => ({ dn, diff: Math.abs(uv[i] - contrast.v[i]), u: uv[i], c: contrast.v[i] }));
  const topDiff3 = [...diffs].sort((a, b) => b.diff - a.diff).slice(0, 3);
  const sameDiff1 = [...diffs].sort((a, b) => a.diff - b.diff)[0];
  const sideDesc = (dn, v) => (v <= 2.5 ? DIM_SIDE[dn][0] : v >= 3.5 ? DIM_SIDE[dn][1] : '居中');

  function buildTriSvg() {
    const W = 100, H = 60;
    const cx = 50, cyTop = 12, cyBottom = 48;
    const sx = 22, cx2 = 78;
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;background:#faf9f6;border-radius:10px" xmlns="http://www.w3.org/2000/svg">';
    svg += '<line x1="' + sx + '" y1="' + cyBottom + '" x2="' + cx + '" y2="' + cyTop + '" stroke="#c9b99a" stroke-width="0.6" stroke-dasharray="2 1.5"/>';
    svg += '<line x1="' + cx + '" y1="' + cyTop + '" x2="' + cx2 + '" y2="' + cyBottom + '" stroke="#c9b99a" stroke-width="0.6" stroke-dasharray="2 1.5"/>';
    svg += '<circle cx="' + cx + '" cy="' + cyTop + '" r="3.4" fill="#d4a017" stroke="#fff" stroke-width="0.7"/>';
    svg += '<text x="' + cx + '" y="' + (cyTop - 2) + '" font-size="2.6" text-anchor="middle" fill="#2d2a26" font-weight="700">你</text>';
    svg += '<circle cx="' + sx + '" cy="' + cyBottom + '" r="2.6" fill="#4a6fa5"/>';
    svg += '<text x="' + (sx - 1) + '" y="' + (cyBottom + 5.5) + '" font-size="2.5" text-anchor="middle" fill="#4a6fa5">' + (person.name.length > 6 ? person.name.slice(0, 6) + '…' : person.name) + '</text>';
    svg += '<circle cx="' + cx2 + '" cy="' + cyBottom + '" r="2.6" fill="none" stroke="#a54a7d" stroke-width="1"/>';
    svg += '<text x="' + (cx2 + 1) + '" y="' + (cyBottom + 5.5) + '" font-size="2.5" text-anchor="middle" fill="#a54a7d">' + (contrast.name.length > 6 ? contrast.name.slice(0, 6) + '…' : contrast.name) + '</text>';
    svg += '<text x="' + ((sx + cx) / 2) + '" y="' + ((cyBottom + cyTop) / 2 - 2) + '" font-size="2.2" fill="#9a938a" text-anchor="middle">同频</text>';
    svg += '<text x="' + ((cx + cx2) / 2) + '" y="' + ((cyBottom + cyTop) / 2 - 2) + '" font-size="2.2" fill="#9a938a" text-anchor="middle">反差</text>';
    svg += '</svg>';
    return svg;
  }

  const tempoLabel = tempo === null ? '' : (tempo <= 2.5 ? '你是先攒大招再亮相的人' : tempo >= 3.5 ? '你是边做边亮出来的人' : '你介于两者之间，看场合');
  const sameFame = person.comparisonFacts && person.comparisonFacts.fameAge ? person.comparisonFacts.fameAge.reason || '' : '';
  const lvl = matchLevel(bd);
  const pct = Math.round((1 - bd / 8) * 100);
  const extra = person.displayExtra || {};
  const sub = proto.subTypes.find((s) => s.members.includes(person.name));

  document.getElementById('quiz').style.display = 'none';
  const r = document.getElementById('result');
  r.style.display = 'block';
  r.innerHTML = `
    <div class="proto-badge">
      <div class="tag">你的历史同频原型</div>
      <div class="name">「${proto.name}」</div>
      <div class="desc">${proto.desc} · 同类 ${proto.members.length} 位</div>
    </div>
    <div class="match-card">
      <div class="name">${person.name}</div>
      <div class="meta">${person.birthYear} 年出生 · ${person.cat === 'science_engineering' ? '科学' : person.cat === 'literature' ? '文学' : person.cat === 'visual_design' ? '视觉艺术' : '音乐'}</div>
      <div class="dist">${sub ? '『' + sub.name + '』' + sub.desc : proto.name}</div>
      <div class="dist">同频度 ${pct}% · ${lvl.label}匹配 —— ${lvl.line}${lvl.label === '独特' ? ' ' + person.name : ''}</div>
      ${extra.introNote ? '<div class="note">' + extra.introNote + '</div>' : ''}
      ${(extra.notableWorks && extra.notableWorks.length) ? '<div class="works">' + extra.notableWorks.map((w) => '<span class="work">' + w + '</span>').join('') + '</div>' : ''}
    </div>
    <div class="map-card">
      <h3>你在历史人格地图上的位置</h3>
      <div class="map-sub">金色圆点是你 —— 离你最近的是 ${top5.map((t) => t.p.name).join('、')}</div>
      <div class="map-wrap">${buildMapSvg(uv, userPos, top5)}</div>
    </div>
    <div class="map-card">
      <h3>你的历史人格三角</h3>
      <div class="map-sub">${person.name} 与你同频，${contrast.name} 与你最有反差</div>
      ${buildTriSvg()}
    </div>
    <div class="match-card">
      <div class="name">历史反差者 · ${contrast.name}</div>
      <div class="meta">${contrast.birthYear} 年出生 · ${contrast.cat === 'science_engineering' ? '科学' : contrast.cat === 'literature' ? '文学' : contrast.cat === 'visual_design' ? '视觉艺术' : '音乐'}</div>
      <div class="note">你们差在哪：</div>
      <div class="note">${topDiff3.map((t) => '· ' + DIM_TAG[t.dn] + '——你' + sideDesc(t.dn, t.u) + '，TA ' + sideDesc(t.dn, t.c)).join('<br>')}</div>
      <div class="note" style="color:#b08d3e">但有一件事你们俩几乎一样：「${DIM_TAG[sameDiff1.dn]}」都${sideDesc(sameDiff1.dn, sameDiff1.u)}</div>
    </div>
    ${tempoLabel ? '<div class="match-card"><div class="note" style="color:#8a857d">被看见的节奏</div><div class="dist">' + tempoLabel + '</div>' + (sameFame ? '<div class="note">' + person.name + '：' + sameFame + '</div>' : '') + '<div class="note" style="color:#b8b2a8">这只是节奏对照，不是对未来成就的预测</div></div>' : ''}
    <div class="peers">
      <h3>和你同频的历史人物</h3>
      <div class="chips">${proto.members.map((m) => '<span class="chip' + (m === person.name ? ' hl' : '') + '">' + m + '</span>').join('')}</div>
    </div>
    <button class="back" onclick="location.reload()">再测一次</button>
  `;
}

init();
render();
</script>
</body>
</html>

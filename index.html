const DIM_ICON = { openness:'💡', conscientiousness:'📋', extraversion:'🎉', agreeableness:'🤝', emotionalStability:'🧘', thinkingFeeling:'🧠', selfPresentation:'✨', worldEngagement:'🌍', fameTier:'⏳' };
const PAGE_SIZE = 4;
const TOTAL_QUESTIONS = DATA.questions.length;
const TOTAL_PAGES = Math.ceil(TOTAL_QUESTIONS / PAGE_SIZE);
const answers = {};
let page = 0;

const qlist = document.getElementById('qlist');
const pbarFill = document.getElementById('pbarFill');
const pbarLabel = document.getElementById('pbarLabel');

function pageQuestions(pg) {
  const start = pg * PAGE_SIZE;
  return DATA.questions.slice(start, start + PAGE_SIZE);
}

function render() {
  qlist.innerHTML = '';
  pageQuestions(page).forEach((q, localIdx) => {
    const qi = page * PAGE_SIZE + localIdx;
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = `
      <div class="qnum">${DIM_ICON[q.dimension]} 第 ${qi + 1} 题 / ${TOTAL_QUESTIONS}</div>
      <div class="qtext">${q.prompt}</div>
      ${q.options.map((o, oi) => '<button class="opt' + (answers[qi] === oi ? ' sel' : '') + '" data-qi="' + qi + '" data-oi="' + oi + '">' + o.text + '</button>').join('')}
    `;
    qlist.appendChild(card);
  });
  qlist.querySelectorAll('.opt').forEach((b) => {
    b.addEventListener('click', () => {
      const qi = +b.dataset.qi, oi = +b.dataset.oi;
      answers[qi] = oi;
      render();
    });
  });

  const done = Object.keys(answers).length;
  pbarFill.style.width = Math.round((done / TOTAL_QUESTIONS) * 100) + '%';
  pbarLabel.textContent = '第 ' + (page + 1) + ' / ' + TOTAL_PAGES + ' 页 · 已完成 ' + done + ' / ' + TOTAL_QUESTIONS;

  const pageDone = pageQuestions(page).every((q, li) => answers[page * PAGE_SIZE + li] !== undefined);
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = !pageDone;
  nextBtn.textContent = page === TOTAL_PAGES - 1 ? '生成结果' : '下一页';
  document.getElementById('prevBtn').className = 'navbtn prev' + (page === 0 ? ' hidden' : '');
}

function prevPage() { if (page > 0) { page--; render(); window.scrollTo({ top: 0 }); } }
function nextPage() {
  const pageDone = pageQuestions(page).every((q, li) => answers[page * PAGE_SIZE + li] !== undefined);
  if (!pageDone) return;
  if (page < TOTAL_PAGES - 1) { page++; render(); window.scrollTo({ top: 0 }); }
  else showResult();
}

function wdist(a, b) {
  let s = 0, wsum = 0;
  for (let i = 0; i < a.length; i++) {
    const w = 1 + DATA.alpha * Math.abs(a[i] - 3);
    s += w * (a[i] - b[i]) ** 2;
    wsum += w;
  }
  return Math.sqrt(s / wsum);
}

function matchLevel(d) {
  if (d < 1.3) return { label: '高', line: '历史上几乎就是你的平行版本' };
  if (d < 2.2) return { label: '中', line: '和你同频度很高，气场接近' };
  return { label: '独特', line: '你太独特了，历史上没有完全像你的人——最接近的是' };
}

const PROTOTYPE_COLORS = ['#c0392b', '#d4a017', '#2e86c1', '#16a085', '#7d6e83', '#8e44ad', '#e67e22', '#27ae60'];

function buildMapSvg(uv, userPos, top5) {
  const W = 100, H = 80;
  const ax = DATA.axis;
  // 轴方向：grad 指向维度高分方向
  const xDir = ax.x.grad[0] >= 0 ? 1 : -1;
  const yDir = ax.y.grad[1] >= 0 ? 1 : -1;

  // —— 视口变换：以用户点为对称中心构建 viewBox（用户点 100% 居中，点阵全覆盖）——
  const SHIFT = 0.85;
  const shiftX = (0.5 - userPos[0]) * SHIFT;
  const shiftY = (0.5 - userPos[1]) * SHIFT;
  const uAbsX = userPos[0] + shiftX;   // 用户点平移后绝对位置
  const uAbsY = userPos[1] + shiftY;
  const PAD = 0.04;
  const vxMin = uAbsX - (Math.max(userPos[0], 1 - userPos[0]) + PAD);
  const vxMax = uAbsX + (Math.max(userPos[0], 1 - userPos[0]) + PAD);
  const vyMin = uAbsY - (Math.max(userPos[1], 1 - userPos[1]) + PAD);
  const vyMax = uAbsY + (Math.max(userPos[1], 1 - userPos[1]) + PAD);
  const vxW = vxMax - vxMin, vyH = vyMax - vyMin;
  const map = (px, py) => [
    ((px + shiftX - vxMin) / vxW) * W,
    ((py + shiftY - vyMin) / vyH) * H,
  ];
  const uxy = map(userPos[0], userPos[1]);

  let svg = '<svg id="map" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  // 轴参考线（淡）
  svg += '<line x1="' + (xDir > 0 ? 2 : W - 2) + '" y1="' + (H / 2) + '" x2="' + (xDir > 0 ? W - 2 : 2) + '" y2="' + (H / 2) + '" stroke="#d8d2c6" stroke-width="0.4" stroke-dasharray="1.5 1.5"/>';
  svg += '<line x1="' + (W / 2) + '" y1="' + (yDir > 0 ? 2 : H - 2) + '" x2="' + (W / 2) + '" y2="' + (yDir > 0 ? H - 2 : 2) + '" stroke="#d8d2c6" stroke-width="0.4" stroke-dasharray="1.5 1.5"/>';
  // X 轴标签（左=低分端，右=高分端）
  svg += '<text x="' + (xDir > 0 ? 2 : W - 2) + '" y="' + (H / 2 - 1.5) + '" font-size="2.4" fill="#9a938a" text-anchor="' + (xDir > 0 ? 'start' : 'end') + '">' + ax.x.labelLow + ' ←</text>';
  svg += '<text x="' + (xDir > 0 ? W - 2 : 2) + '" y="' + (H / 2 - 1.5) + '" font-size="2.4" fill="#9a938a" text-anchor="' + (xDir > 0 ? 'end' : 'start') + '">→ ' + ax.x.labelHigh + '</text>';
  // Y 轴标签（下=低分端，上=高分端）
  svg += '<text x="' + (W / 2) + '" y="' + (yDir > 0 ? 4 : H - 3) + '" font-size="2.4" fill="#9a938a" text-anchor="middle">' + ax.y.labelHigh + ' ↑</text>';
  svg += '<text x="' + (W / 2) + '" y="' + (yDir > 0 ? H - 3 : 5) + '" font-size="2.4" fill="#9a938a" text-anchor="middle">↓ ' + ax.y.labelLow + '</text>';
  // 人物点：top5 高亮标名（贪心避让：6 候选位 + 矩形重叠检测），其余小点
  const labeled = top5.slice(0, 5);
  const labelSet = new Set(labeled.map((t) => t.p.name));
  const usedLabels = [];
  const FS = 2.7;                    // 字号
  const LH = FS + 1.2;               // 行高（含白边）
  const textW = (s) => s.length * (FS + 0.2);
  function overlaps(box) {
    for (const u of usedLabels) {
      if (box.x < u.x + u.w + 1.2 && box.x + box.w + 1.2 > u.x && box.y < u.y + LH && box.y + LH > u.y) return true;
    }
    return false;
  }
  DATA.people.forEach((p) => {
    const [mx, my] = map(p.umap[0], p.umap[1]);
    const px = mx * W, py = my * H;
    const color = PROTOTYPE_COLORS[p.prototype];
    const isTop = labelSet.has(p.name);
    svg += '<circle cx="' + px + '" cy="' + py + '" r="' + (isTop ? 2.2 : 1.0) + '" fill="' + color + '" opacity="' + (isTop ? 0.95 : 0.35) + '"/>';
    if (isTop) {
      const w = textW(p.name);
      const left = px - w / 2, right = px + w / 2;
      const cand = (x, y, anchor, boxX, boxY) => {
        // 边界钳制（避免文字出界）
        let cx = x, cy = y, bx = boxX, by = boxY;
        if (anchor === 'middle') { cx = Math.max(1.5 + w / 2, Math.min(W - 1.5 - w / 2, cx)); bx = cx - w / 2; }
        else if (anchor === 'start') { cx = Math.max(1.5, Math.min(W - 1.5 - w, cx)); bx = cx; }
        else { cx = Math.max(1.5 + w, Math.min(W - 1.5, cx)); bx = cx - w; }
        cy = Math.max(2, Math.min(H - 1.5, cy)); by = cy;
        return { x: cx, y: cy, anchor, boxX: bx, boxY: by };
      };
      const candidates = [
        cand(px - w / 2, py - LH - 0.6, 'middle', left, py - LH - 0.6),
        cand(px - w / 2, py + 3.2, 'middle', left, py + 3.2),
        cand(px + 2.6, py - 1.2, 'start', right + 1.2, py - LH / 2),
        cand(px + 2.6, py + LH - 0.8, 'start', right + 1.2, py + LH - 0.8),
        cand(px - 2.6, py - 1.2, 'end', left - 1.2 - w, py - LH / 2),
        cand(px - 2.6, py + LH - 0.8, 'end', left - 1.2 - w, py + LH - 0.8),
      ];
      let chosen = null;
      for (const c of candidates) {
        const box = { x: Math.min(c.boxX, c.boxX + w), y: c.boxY, w: Math.abs(w), h: LH };
        if (!overlaps(box)) { chosen = c; break; }
      }
      if (!chosen) chosen = candidates[0];
      const box = { x: Math.min(chosen.boxX, chosen.boxX + w), y: chosen.boxY, w: Math.abs(w), h: LH };
      usedLabels.push(box);
      svg += '<text x="' + chosen.x + '" y="' + chosen.y + '" font-size="' + FS + '" fill="#2d2a26" font-weight="600" stroke="#faf9f6" stroke-width="0.9" paint-order="stroke" text-anchor="' + chosen.anchor + '">' + p.name + '</text>';
    }
  });
  // 用户位置（变换后）
  const ux = uxy[0] * W, uy = uxy[1] * H;
  svg += '<circle cx="' + ux + '" cy="' + uy + '" r="6" fill="#d4a017" opacity="0.18"/>';
  svg += '<circle cx="' + ux + '" cy="' + uy + '" r="3.4" fill="#d4a017" stroke="#fff" stroke-width="0.8"/>';
  svg += '</svg>';
  return svg;
}

function showResult() {
  const sums = new Array(9).fill(0), cnt = new Array(9).fill(0);
  DATA.questions.forEach((q, qi) => {
    const di = DATA.dims.indexOf(q.dimension);
    sums[di] += q.options[answers[qi]].score; cnt[di]++;
  });
  const uv = sums.map((s, i) => s / cnt[i]);

  let bd = Infinity, bi = 0;
  DATA.people.forEach((p, i) => { const d = wdist(uv, p.v); if (d < bd) { bd = d; bi = i; } });
  const person = DATA.people[bi];

  let pc = 0, pbd = Infinity;
  DATA.prototypes.forEach((pt, i) => { const d = wdist(uv, pt.center); if (d < pbd) { pbd = d; pc = i; } });
  const proto = DATA.prototypes[pc];
  const same = proto.members.filter((m) => m !== person.name);

  // top5 最近邻（含用户位置近似）
  const top5 = DATA.people.map((p, i) => ({ p, d: wdist(uv, p.v) })).sort((a, b) => a.d - b.d).slice(0, 5);
  const wSum = top5.reduce((s, t) => s + 1 / (t.d + 0.15), 0);
  const userPos = top5.reduce((acc, t) => {
    const w = 1 / (t.d + 0.15);
    acc[0] += w * t.p.umap[0]; acc[1] += w * t.p.umap[1];
    return acc;
  }, [0, 0]).map((v) => v / wSum);

  const lvl = matchLevel(bd);
  const pct = Math.round((1 - bd / 8) * 100);
  const extra = person.displayExtra || {};
  const sub = proto.subTypes.find((s) => s.members.includes(person.name));

  document.getElementById('quiz').style.display = 'none';
  const r = document.getElementById('result');
  r.style.display = 'block';
  r.innerHTML = `
    <div class="proto-badge">
      <div class="tag">你的历史同频原型</div>
      <div class="name">「${proto.name}」</div>
      <div class="desc">${proto.desc} · 同类 ${proto.members.length} 位</div>
    </div>
    <div class="match-card">
      <div class="name">${person.name}</div>
      <div class="meta">${person.birthYear} 年出生 · ${person.cat === 'science_engineering' ? '科学' : person.cat === 'literature' ? '文学' : person.cat === 'visual_design' ? '视觉艺术' : '音乐'}</div>
      <div class="dist">${sub ? '『' + sub.name + '』' + sub.desc : proto.name}</div>
      <div class="dist">同频度 ${pct}% · ${lvl.label}匹配 —— ${lvl.line}${lvl.label === '独特' ? ' ' + person.name : ''}</div>
      ${extra.introNote ? '<div class="note">' + extra.introNote + '</div>' : ''}
      ${person.fameNote ? '<div class="note">' + person.fameNote + '</div>' : ''}
      ${(extra.notableWorks && extra.notableWorks.length) ? '<div class="works">' + extra.notableWorks.map((w) => '<span class="work">' + w + '</span>').join('') + '</div>' : ''}
    </div>
    <div class="map-card">
      <h3>你在历史人格地图上的位置</h3>
      <div class="map-sub">金色圆点是你 —— 离你最近的是 ${top5.map((t) => t.p.name).join('、')}</div>
      <div class="map-wrap">${buildMapSvg(uv, userPos, top5)}</div>
    </div>
    <div class="peers">
      <h3>和你同频的历史人物</h3>
      <div class="chips">${proto.members.map((m) => '<span class="chip' + (m === person.name ? ' hl' : '') + '">' + m + '</span>').join('')}</div>
    </div>
    <button class="back" onclick="location.reload()">再测一次</button>
  `;
}

render();
</script>
</body>
</html>
